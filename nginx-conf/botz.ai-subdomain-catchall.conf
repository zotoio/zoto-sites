server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name  *.botz.ai;

    error_page 404 /subdomain-not-found.html;

    location / {
        return 404;
    }

    location = /subdomain-not-found.html {
        root /usr/share/nginx/html/botz.ai;
        internal;
    }

    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 /error.html;

    location /error.html {
      ssi on;
      internal;
      auth_basic off;
      root /usr/share/nginx/html;
    }
}
