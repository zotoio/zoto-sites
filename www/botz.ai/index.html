<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3HMC4TBL9L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-3HMC4TBL9L', { 'page_location': window.location.href });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>botz.ai - GenAI News</title>
  <link rel="stylesheet" href="style.css?v=20260928">
  <meta name="description"
    content="Botz.ai offers the latest news and insights in the world of artificial intelligence. Stay updated with AI trends, breakthroughs, and analysis. Discover how AI is transforming technology and industries worldwide.">
  <meta name="keywords"
    content="GenAI News, AI news, llms, large language models, gemini, ollama, openai, anthropic, claude, artificial intelligence, AI trends, AI breakthroughs, AI analysis, machine learning, deep learning, AI technology, AI in business, AI updates, AI research">
</head>

<body>
  <header class="site-head">
    <h1><a href="/"><img src="favicon.ico" width="40" height="40" alt=""> GenAI News</a></h1>
    <a href="#" class="random-link" aria-label="Random story"><img src="perspective-dice-random.svg" alt=""
        id="random-icon" class="random-icon" style="filter: brightness(0) invert(1); width: 30px; height: 30px;"></a>
  </header>

  <main class="wrap">
    <section class="stage" id="stage" aria-roledescription="carousel" aria-label="Featured stories">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div class="scene" id="scene"></div>
      <div class="stage-end" id="end-marker" hidden aria-hidden="true"><span class="stage-end-label">Latest</span></div>

      <article class="card" id="card" aria-live="polite"></article>
      <div class="card measure" id="measure" aria-hidden="true"></div>
      <p class="hint" id="hint">← / → keys, click a side card, or swipe</p>
    </section>

    <section class="browse" aria-labelledby="browse-h">
      <h2 id="browse-h">More stories</h2>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <p class="error-message" role="alert"></p>
  <div id="loading" style="display: none;">Loading...</div>
  <div id="story-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="scroll-to-top" class="scroll-to-top" role="button" tabindex="0" aria-label="Scroll to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6" />
    </svg>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      if (typeof gtag === 'function') {
        gtag('event', 'javascript_error', {
          'event_category': 'JS Error',
          'event_label': `${message} at ${source}:${lineno}:${colno}`,
          'non_interaction': true,
          'error_details': error ? error.stack : 'N/A'
        });
      }
    };

    const scrollToTopButton = document.getElementById('scroll-to-top');
    function toggleScrollToTopButton() {
      if (window.pageYOffset > 300) scrollToTopButton.classList.add('visible');
      else scrollToTopButton.classList.remove('visible');
    }
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    window.addEventListener('scroll', toggleScrollToTopButton);
    scrollToTopButton.addEventListener('click', scrollToTop);
    scrollToTopButton.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); scrollToTop(); } });
  </script>
  <script type="module" src="carousel-app.js?v=20260928"></script>
</body>

</html>
