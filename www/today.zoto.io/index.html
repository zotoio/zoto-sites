<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Location-aware widget dashboard: weather, news, transit, and more." />
    <title>Today · zoto.io</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="/vendor/gridstack/gridstack.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>

    <main class="shell" id="main">
      <div class="toolbar" role="toolbar" aria-label="Dashboard controls">
        <button type="button" id="add-widget-btn" class="fab" aria-expanded="false" aria-controls="widget-library" title="Add widget">
          +
        </button>
        <button type="button" id="reset-layout-btn" class="btn-ghost">Reset layout</button>
      </div>

      <aside id="widget-library" class="widget-library" hidden aria-label="Widget library">
        <header class="library-head">
          <h2>Add a widget</h2>
          <p class="library-help">Removed widgets reappear here. Drag headers to move; resize from corners.</p>
        </header>
        <ul id="widget-library-list" class="library-list"></ul>
      </aside>

      <div id="widget-grid" class="grid-stack widget-canvas" aria-label="Widget canvas"></div>

      <footer class="foot">
        <p>
          Imagery © Esri, Maxar · Weather &amp; air quality via
          <a href="https://open-meteo.com/" rel="noopener noreferrer">Open-Meteo</a>
          · Radar © RainViewer · Map © OpenStreetMap
        </p>
        <p class="demo-hint" id="demo-hint"></p>
      </footer>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/vendor/gridstack/gridstack-all.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
