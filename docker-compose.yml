services:
  nginx:
    build: .
    restart: always
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backends/botz.ai/cache:/usr/share/nginx/html/botz.ai/cache
      # Mount real TLS certs in production (see docs/DEPLOYMENT.md).
      # Without this mount, krewh/hardened-nginx serves a self-signed certificate.
      - ${SSL_CERT_DIR:-./ssl}:/etc/nginx/ssl:ro
    depends_on:
      - botz

  botz:
    build: ./backends/botz.ai
    restart: always
    container_name: botz
    env_file:
      - ./backends/botz.ai/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backends/botz.ai/cache:/home/root/cache

  discord:
    build: ./backends/discord
    restart: always
    container_name: discord
    env_file:
      - ./backends/discord/.env
