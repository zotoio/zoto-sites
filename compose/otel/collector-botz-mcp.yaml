# Internal-only OTEL collector for botz-mcp (one per system; never shared, never published).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 96
    spike_limit_mib: 24
  resource:
    attributes:
      - key: collector.system
        value: botz-mcp
        action: upsert
  batch: {}
exporters:
  file:
    path: /data/otel-botz-mcp.jsonl
    rotation:
      max_megabytes: 20
      max_days: 7
      max_backups: 3

service:
  telemetry:
    logs: { level: warn }
  pipelines:
    traces: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [file] }
    metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [file] }
    logs: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [file] }
