services:
  nginx:
    build: .
    restart: always
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backends/botz.ai/cache:/usr/share/nginx/html/botz.ai/cache:ro
      # Host TLS material (LE sync or migrated from the running container). Entrypoint copies into /etc/nginx/ssl.
      - ${SSL_CERT_DIR:-./ssl}:/etc/nginx/certs:ro
    depends_on:
      - botz

  botz:
    build:
      context: .
      dockerfile: backends/botz.ai/Dockerfile
    restart: always
    container_name: botz
    env_file:
      - ./backends/botz.ai/.env
    environment:
      CACHE_DIR: /home/root/cache
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backends/botz.ai/cache:/home/root/cache

  discord:
    build: ./backends/discord
    restart: always
    container_name: discord
    env_file:
      - ./backends/discord/.env
