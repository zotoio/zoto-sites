<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-3HMC4TBL9L', { 'page_location': window.location.href });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>botz.ai - GenAI News</title>
  <link rel="stylesheet" href="style.css?v=20261019e">
  <meta name="description"
    content="Botz.ai offers the latest news and insights in the world of artificial intelligence. Stay updated with AI trends, breakthroughs, and analysis. Discover how AI is transforming technology and industries worldwide.">
  <meta name="keywords"
    content="GenAI News, AI news, llms, large language models, gemini, ollama, openai, anthropic, claude, artificial intelligence, AI trends, AI breakthroughs, AI analysis, machine learning, deep learning, AI technology, AI in business, AI updates, AI research">
</head>

<body>
  <header class="site-head">
    <h1><a href="/"><img src="favicon.ico" width="40" height="40" alt=""> GenAI News</a></h1>
    <a href="#" class="random-link" aria-label="Random story"><img src="perspective-dice-random.svg" alt=""
        id="random-icon" class="random-icon" style="filter: brightness(0) invert(1); width: 30px; height: 30px;"></a>
  </header>

  <main class="wrap">
    <section class="stage" id="stage" aria-roledescription="carousel" aria-label="Featured stories">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div class="scene" id="scene"></div>
      <div class="stage-end" id="end-marker" hidden aria-hidden="true"><span class="stage-end-label">Latest</span></div>

      <article class="card is-skeleton" id="card" aria-live="polite" aria-busy="true"><span class="sr-only" role="status">Loading story</span><div class="card-head skel-head" aria-hidden="true"><div class="skel skel-kicker"></div></div><div class="card-body skel-body" aria-hidden="true"><div class="skel skel-img"></div><div class="card-text"><div class="skel skel-line skel-title"></div><div class="skel skel-line skel-title skel-w60"></div><div class="skel skel-line skel-byline"></div><div class="skel-paras"><div class="skel-para"><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line skel-w70"></div></div><div class="skel-para"><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line skel-w85"></div></div><div class="skel-para skel-para-extra"><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line skel-w60"></div></div></div><div class="skel skel-btn skel-readmore"></div><div class="skel-meta"><div class="skel skel-line skel-meta-line"></div><div class="skel skel-line skel-meta-line"></div><div class="skel skel-line skel-meta-line"></div><div class="skel skel-line skel-meta-line"></div></div></div></div><div class="card-foot skel-foot" aria-hidden="true"><div class="skel skel-btn"></div><div class="skel skel-btn"></div></div></article>
      <div class="card measure" id="measure" aria-hidden="true"></div>
      <p class="hint" id="hint">← / → keys, click a side card, or swipe</p>
    </section>

    <section class="browse awaiting-top" id="browse" aria-labelledby="browse-h">
      <h2 id="browse-h">More stories</h2>
      <div class="grid" id="grid" aria-busy="true"><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div><div class="tile-skel" aria-hidden="true"><div class="skel skel-tile-img"></div><div class="tile-body"><div class="skel skel-line skel-tile-title"></div><div class="skel skel-line skel-tile-title skel-w60"></div><div class="skel skel-line skel-tile-meta"></div></div></div></div>
    </section>
  </main>

  <p class="error-message" role="alert"></p>
  <div id="loading" style="display: none;">Loading...</div>
  <div id="story-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div class="img-modal" id="img-modal" role="dialog" aria-modal="true" aria-label="Story image" hidden>
    <button type="button" class="img-modal-close" aria-label="Close image">&times;</button>
    <img class="img-modal-img" alt="">
  </div>

  <div id="scroll-to-top" class="scroll-to-top" role="button" tabindex="0" aria-label="Scroll to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15l-6-6-6 6" />
    </svg>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      if (typeof gtag === 'function') {
        gtag('event', 'javascript_error', {
          'event_category': 'JS Error',
          'event_label': `${message} at ${source}:${lineno}:${colno}`,
          'non_interaction': true,
          'error_details': error ? error.stack : 'N/A'
        });
      }
    };

    const scrollToTopButton = document.getElementById('scroll-to-top');
    function toggleScrollToTopButton() {
      if (window.pageYOffset > 300) scrollToTopButton.classList.add('visible');
      else scrollToTopButton.classList.remove('visible');
    }
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
    window.addEventListener('scroll', toggleScrollToTopButton);
    scrollToTopButton.addEventListener('click', scrollToTop);
    scrollToTopButton.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); scrollToTop(); } });
  </script>
  <script type="module" src="carousel-app.js?v=20261019e"></script>
</body>

</html>
