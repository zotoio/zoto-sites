name: CI

on:
  pull_request:
  push:
    branches: [main]

# D5: least-privilege token by default; widen per job only where needed.
permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint (download script pinned to v1.7.12 commit)
        shell: bash
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: today.zoto.io layout storage tests
        run: node --test www/today.zoto.io/test/layout-storage.test.mjs

      - name: today.zoto.io layout gutter tests
        run: node --test www/today.zoto.io/test/layout-gutter.test.mjs www/today.zoto.io/test/layout-normalize.test.mjs

      - name: today.zoto.io widget registry tests
        run: node --test www/today.zoto.io/test/widget-registry.test.mjs

      - name: today.zoto.io display mode tests
        run: node --test www/today.zoto.io/test/display-mode.test.mjs

      - name: today.zoto.io weather utils tests
        run: node --test www/today.zoto.io/test/weather-utils.test.mjs

      - name: today.zoto.io location search tests
        run: node --test www/today.zoto.io/test/location-search.test.mjs

      - name: Install today.zoto.io API dependencies
        run: yarn --cwd backends/today.zoto.io install --frozen-lockfile

      - name: today.zoto.io API tests
        run: yarn --cwd backends/today.zoto.io test

      - name: Verify today Docker image build and smoke test
        run: bash scripts/verify-today-docker-image.sh

      - name: botz.ai dice roll physics tests
        run: node --test scripts/botz-dice-physics.test.mjs

      - name: nginx generator tests
        run: node --test scripts/generate-nginx.test.mjs

      - name: Verify nginx configs match sites manifest
        run: node scripts/generate-nginx.js --check

      - name: Validate botz.ai subdomain manifests
        run: |
          node scripts/validate-botz-projects.js
          node --test scripts/lib/botz-projects.test.mjs

      - name: Validate persistent bind mounts (docker compose)
        run: node scripts/check-persistent-mounts.js

      - name: Shell syntax check (deploy scripts)
        run: |
          bash -n scripts/deploy-safe.sh
          bash -n scripts/deploy.sh
          bash -n scripts/compose-stack.sh
          bash -n scripts/deploy-backend.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x scripts/deploy-safe.sh scripts/deploy.sh scripts/sync-ssl.sh || true
          fi

      - name: nginx configuration test (hardened image)
        run: |
          docker build -q -t zoto-sites-nginx-ci .
          mapfile -t PROXY_HOSTS < <(node scripts/nginx-ci-proxy-hosts.js)
          HOST_ARGS=()
          for h in "${PROXY_HOSTS[@]}"; do
            HOST_ARGS+=(--add-host "${h}:127.0.0.1")
          done
          docker run --rm "${HOST_ARGS[@]}" --entrypoint /bin/sh zoto-sites-nginx-ci -ec '
            CERT_DIR=/etc/nginx/ssl
            mkdir -p "$CERT_DIR"
            if [ ! -s "$CERT_DIR/default_cert.pem" ]; then
              openssl req -subj "/CN=localhost" -x509 -newkey rsa:4096 -nodes \
                -keyout "$CERT_DIR/default_key.pem" -out "$CERT_DIR/default_cert.pem" -days 365
            fi
            nginx -t
          '

      - name: botz.ai OpenAI image API contract
        run: |
          yarn --cwd backends/botz.ai install --frozen-lockfile
          yarn --cwd backends/botz.ai test

      - name: botz.ai idle autoplay tests
        run: node --test scripts/botz-autoplay.test.mjs

      - name: botz.ai carousel polish guards (image shape, Read more, loading FOUC)
        run: node --test scripts/botz-carousel-polish.test.mjs

      - name: botz.ai arrow navigation guards
        run: node --test scripts/botz-arrow-nav.test.mjs

      - name: botz.ai review fixes + next-story countdown guards
        run: node --test scripts/botz-review-fixes.test.mjs

      - name: Verify botz Docker image includes runtime modules
        run: bash scripts/verify-botz-docker-image.sh
