services:
  nginx:
    build: .
    restart: always
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backends/botz.ai/cache:/usr/share/nginx/html/botz.ai/cache
      # Origin TLS: synced from host Let's Encrypt via scripts/sync-ssl.sh
      # (see docs/DEPLOYMENT.md — Cloudflare Full Strict to origin :443).
      # Without certs here, krewh/hardened-nginx uses a self-signed cert (local dev).
      - ${SSL_CERT_DIR:-./ssl}:/etc/nginx/ssl:ro
    depends_on:
      - botz

  botz:
    build: ./backends/botz.ai
    restart: always
    container_name: botz
    env_file:
      - ./backends/botz.ai/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backends/botz.ai/cache:/home/root/cache

  discord:
    build: ./backends/discord
    restart: always
    container_name: discord
    env_file:
      - ./backends/discord/.env
