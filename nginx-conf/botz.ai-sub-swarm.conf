map $http_cf_connecting_ip $otlp_swarm_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $otlp_swarm_client zone=otlp_swarm:10m rate=20r/s;

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name  swarm.botz.ai; # swarm.botz.ai
    client_max_body_size 16m;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;

    location ^~ /otlp/v1/ {
        limit_req zone=otlp_swarm burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $project_upstream "http://swarm:4310";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_pass $project_upstream;
        error_page 502 504 = @botz_sub_swarm_unavailable;
    }

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $project_upstream "http://swarm:4310";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_connect_timeout 75s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $project_upstream;
        error_page 502 504 = @botz_sub_swarm_unavailable;
    }

    location @botz_sub_swarm_unavailable {
        internal;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "Service temporarily unavailable. Please retry shortly.";
    }

    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 /error.html;

    location /error.html {
      ssi on;
      internal;
      auth_basic off;
      root /usr/share/nginx/html;
    }
}
