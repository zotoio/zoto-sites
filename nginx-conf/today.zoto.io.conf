server {
    listen 443 ssl;
    http2 on;
    server_name  today.zoto.io;

    location / {
        root   /usr/share/nginx/html/today.zoto.io;
        index  index.html index.htm;
    }

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $dynamic_upstream "http://today:3001";
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_connect_timeout 75s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        proxy_pass $dynamic_upstream;
        error_page 502 503 504 = @today_zoto_io_api_unavailable;
    }

    location @today_zoto_io_api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false,"error":"API temporarily unavailable. Static pages still load; retry shortly."}';
    }

    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 /error.html;

    location /error.html {
      ssi on;
      internal;
      auth_basic off;
      root /usr/share/nginx/html;
    }
}
